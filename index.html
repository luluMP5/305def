<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Définitions d'Histoire</title>
<script>
  (function () {
    var t = 'light';
    try { if (localStorage.getItem('theme') === 'dark') t = 'dark'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --fond: #EFEFEF;
    --carte: #FFFFFF;
    --bordure: #D0D0D0;
    --bordure-hover: #8A8A8A;
    --bordure-forte: #111111;
    --texte: #111111;
    --texte-doux: #6B6B6B;
    --sur-texte: #FFFFFF;
    --bouton-hover: #333333;
    --desactive-texte: #8A8A8A;
    --saisie-off: #F6F6F6;
    --correction-fond: #F7F7F7;
    --ombre: rgba(0, 0, 0, .08);
    --ombre-forte: rgba(0, 0, 0, .14);
    --ok: #2F7D4F;
    --ok-fond: #EAF5EE;
    --ko: #B3403A;
    --ko-fond: #FBEDEC;
    --sur-couleur: #FFFFFF;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --fond: #121212;
    --carte: #1C1C1C;
    --bordure: #333333;
    --bordure-hover: #777777;
    --bordure-forte: #F2F2F2;
    --texte: #F2F2F2;
    --texte-doux: #A3A3A3;
    --sur-texte: #111111;
    --bouton-hover: #D6D6D6;
    --desactive-texte: #777777;
    --saisie-off: #161616;
    --correction-fond: #232323;
    --ombre: rgba(0, 0, 0, .5);
    --ombre-forte: rgba(0, 0, 0, .6);
    --ok: #4CB87E;
    --ok-fond: #12261B;
    --ko: #E5736D;
    --ko-fond: #2B1615;
    --sur-couleur: #111111;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  body {
    min-height: 100vh;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--texte);
    background: var(--fond);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 24px;
    -webkit-font-smoothing: antialiased;
    transition: background-color .25s ease, color .25s ease;
  }

  button, input, textarea { font: inherit; color: inherit; }

  .vue {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- En-tête ---------- */
  header {
    text-align: center;
    margin-top: clamp(76px, 12vh, 120px);
  }

  .surtitre {
    font-size: .8rem;
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--texte-doux);
  }

  h1 {
    margin-top: 14px;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 700;
    letter-spacing: -.025em;
    line-height: 1.1;
  }

  .sous-titre {
    margin-top: 14px;
    font-size: 1.05rem;
    color: var(--texte-doux);
  }

  main {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(40px, 8vh, 80px) 0;
  }

  /* ---------- Cartes niveaux ---------- */
  .niveaux {
    width: 100%;
    max-width: 980px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .carte {
    background: var(--carte);
    border: 1px solid var(--bordure);
    border-radius: 12px;
    padding: 28px 24px 24px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    text-align: left;
    cursor: pointer;
    transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }

  .carte:hover,
  .carte:focus-visible {
    border-color: var(--bordure-forte);
    box-shadow: 0 8px 24px var(--ombre);
    transform: translateY(-3px);
    outline: none;
  }

  .numero {
    font-size: .85rem;
    font-weight: 600;
    letter-spacing: .1em;
    color: var(--texte-doux);
  }

  .carte h2 {
    margin-top: 10px;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -.015em;
  }

  .consigne {
    margin-top: 10px;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--texte-doux);
  }

  .difficulte {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid var(--bordure);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: .85rem;
    font-weight: 500;
  }
  .carte .difficulte { width: 100%; }

  .points { display: flex; gap: 5px; }
  .points i {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--bordure);
    display: block;
  }
  .points i.plein { background: var(--texte); }

  /* ---------- Vue chapitres ---------- */
  .bloc-chapitres {
    width: 100%;
    max-width: 720px;
    margin-top: clamp(76px, 9vh, 90px);
    padding-bottom: 60px;
  }

  .retour {
    background: none;
    border: none;
    cursor: pointer;
    font-size: .95rem;
    font-weight: 500;
    color: var(--texte-doux);
    padding: 6px 0;
    transition: color .2s ease;
  }
  .retour:hover { color: var(--texte); }

  .entete-chapitres { margin-top: 28px; }
  .badge {
    display: inline-block;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--texte);
    color: var(--sur-texte);
  }
  .entete-chapitres h2 {
    margin-top: 16px;
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    font-weight: 700;
    letter-spacing: -.025em;
    line-height: 1.15;
  }
  .entete-chapitres p {
    margin-top: 10px;
    color: var(--texte-doux);
    font-size: 1.05rem;
  }

  .barre-outils {
    margin-top: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: .9rem;
    color: var(--texte-doux);
  }
  .lien {
    background: none;
    border: none;
    cursor: pointer;
    font-size: .9rem;
    font-weight: 500;
    color: var(--texte);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .liste-chapitres {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .chapitre {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--carte);
    border: 1px solid var(--bordure);
    border-radius: 12px;
    padding: 22px 24px;
    cursor: pointer;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .chapitre:hover { border-color: var(--bordure-hover); }

  .chapitre input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .case {
    flex: none;
    width: 26px; height: 26px;
    border: 2px solid var(--bordure);
    border-radius: 7px;
    display: grid;
    place-items: center;
    transition: background .15s ease, border-color .15s ease;
  }
  .case svg {
    width: 16px; height: 16px;
    stroke: var(--sur-texte);
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    transition: opacity .15s ease;
  }

  .chapitre:has(input:checked) {
    border-color: var(--bordure-forte);
    box-shadow: 0 0 0 1px var(--bordure-forte);
  }
  .chapitre input:checked + .case {
    background: var(--texte);
    border-color: var(--texte);
  }
  .chapitre input:checked + .case svg { opacity: 1; }
  .chapitre:has(input:focus-visible) { outline: 2px solid var(--texte); outline-offset: 3px; }

  .chapitre .texte small {
    display: block;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--texte-doux);
  }
  .chapitre .texte strong {
    display: block;
    margin-top: 5px;
    font-size: 1.2rem;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -.01em;
  }

  .actions {
    margin-top: 32px;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }
  .bouton {
    background: var(--texte);
    color: var(--sur-texte);
    border: 1px solid var(--texte);
    border-radius: 10px;
    padding: 14px 28px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s ease, opacity .2s ease;
  }
  .bouton:hover:not(:disabled) { background: var(--bouton-hover); }
  .bouton:disabled {
    background: var(--bordure);
    border-color: var(--bordure);
    color: var(--desactive-texte);
    cursor: not-allowed;
  }
  .bouton.clair {
    background: var(--carte);
    color: var(--texte);
    border-color: var(--bordure);
  }
  .bouton.clair:hover:not(:disabled) { border-color: var(--texte); background: var(--carte); }

  /* ---------- Vue quiz ---------- */
  .bloc-quiz {
    width: 100%;
    max-width: 720px;
    margin-top: clamp(76px, 9vh, 90px);
    padding-bottom: 60px;
  }

  .haut-quiz {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .progression { margin-top: 18px; }
  .progression .texte-prog {
    display: flex;
    justify-content: space-between;
    font-size: .85rem;
    font-weight: 500;
    color: var(--texte-doux);
  }
  .piste {
    margin-top: 8px;
    height: 6px;
    border-radius: 999px;
    background: var(--bordure);
    overflow: hidden;
  }
  .piste div {
    height: 100%;
    width: 0;
    background: var(--texte);
    border-radius: 999px;
    transition: width .35s ease;
  }

  .question {
    margin-top: 24px;
    background: var(--carte);
    border: 1px solid var(--bordure);
    border-radius: 14px;
    padding: 32px 32px 28px;
  }
  .question .etiquette {
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--texte-doux);
  }
  .question .enonce {
    margin-top: 12px;
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.25;
  }
  .question .enonce small {
    display: block;
    margin-top: 6px;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--texte-doux);
  }
  .question .enonce.definition {
    font-size: clamp(1.15rem, 2.4vw, 1.4rem);
    font-weight: 500;
    letter-spacing: -.01em;
    line-height: 1.5;
  }

  .zone-reponse { margin-top: 26px; }

  /* Niveau 1 : propositions */
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    text-align: left;
    background: var(--carte);
    border: 1px solid var(--bordure);
    border-radius: 12px;
    padding: 16px 18px;
    line-height: 1.45;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--texte); }
  .option .lettre {
    flex: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid var(--bordure);
    display: grid;
    place-items: center;
    font-size: .8rem;
    font-weight: 600;
    color: var(--texte-doux);
    margin-top: 1px;
  }
  .option:disabled { cursor: default; }
  .option.juste { border-color: var(--ok); background: var(--ok-fond); }
  .option.juste .lettre { background: var(--ok); border-color: var(--ok); color: var(--sur-couleur); }
  .option.faux { border-color: var(--ko); background: var(--ko-fond); }
  .option.faux .lettre { background: var(--ko); border-color: var(--ko); color: var(--sur-couleur); }
  .option.neutre { opacity: .55; }

  /* Niveaux 2 et 3 : saisie */
  .saisie {
    width: 100%;
    background: var(--carte);
    border: 1px solid var(--bordure);
    border-radius: 12px;
    padding: 15px 18px;
    font-size: 1.05rem;
    outline: none;
    transition: border-color .15s ease;
  }
  .saisie:focus { border-color: var(--texte); }
  textarea.saisie { min-height: 130px; resize: vertical; line-height: 1.5; }
  .saisie:disabled { background: var(--saisie-off); }

  .ligne-actions {
    margin-top: 16px;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }
  .ligne-actions .bouton { padding: 12px 22px; font-size: .95rem; }

  /* Retour de correction */
  .correction {
    margin-top: 22px;
    border-radius: 12px;
    padding: 18px 20px;
    border: 1px solid var(--bordure);
    background: var(--correction-fond);
    line-height: 1.5;
  }
  .correction.juste { background: var(--ok-fond); border-color: var(--ok); }
  .correction.faux  { background: var(--ko-fond); border-color: var(--ko); }
  .correction .statut {
    font-weight: 700;
    font-size: 1.05rem;
  }
  .correction.juste .statut { color: var(--ok); }
  .correction.faux .statut  { color: var(--ko); }
  .correction .bloc-def { margin-top: 10px; }
  .correction .bloc-def span {
    display: block;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--texte-doux);
    margin-bottom: 3px;
  }
  .correction .ta-reponse { white-space: pre-wrap; }

  /* Résultat */
  .resultat {
    margin-top: 24px;
    background: var(--carte);
    border: 1px solid var(--bordure);
    border-radius: 14px;
    padding: 40px 32px 32px;
    text-align: center;
  }
  .resultat .score {
    font-size: clamp(3rem, 9vw, 5rem);
    font-weight: 700;
    letter-spacing: -.04em;
    line-height: 1;
  }
  .resultat .score small {
    font-size: .4em;
    font-weight: 500;
    color: var(--texte-doux);
    letter-spacing: 0;
  }
  .resultat .message {
    margin-top: 14px;
    font-size: 1.15rem;
    color: var(--texte-doux);
  }
  .resultat .actions { justify-content: center; flex-wrap: wrap; }

  .a-revoir { margin-top: 28px; text-align: left; }
  .a-revoir h3 {
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--texte-doux);
    margin-bottom: 12px;
  }
  .a-revoir ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .a-revoir li {
    border: 1px solid var(--bordure);
    border-radius: 10px;
    padding: 14px 16px;
    line-height: 1.5;
  }
  .a-revoir li strong { display: block; font-weight: 600; }
  .a-revoir li span { color: var(--texte-doux); font-size: .95rem; }

  /* ---------- Réglages (jour / nuit) ---------- */
  .reglages {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 50;
  }
  .bouton-reglages {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--carte);
    border: 1px solid var(--bordure);
    color: var(--texte);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: border-color .2s ease, background-color .25s ease;
  }
  .bouton-reglages:hover,
  .bouton-reglages:focus-visible { border-color: var(--bordure-forte); outline: none; }
  .bouton-reglages svg {
    width: 22px;
    height: 22px;
    transition: transform .35s ease;
  }
  .bouton-reglages[aria-expanded="true"] svg { transform: rotate(60deg); }

  .panneau-reglages {
    position: absolute;
    top: 54px;
    right: 0;
    width: 280px;
    max-width: calc(100vw - 32px);
    background: var(--carte);
    border: 1px solid var(--bordure);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 12px 32px var(--ombre-forte);
  }
  .titre-panneau {
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--texte-doux);
    margin-bottom: 12px;
  }
  .choix-theme {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .choix-theme button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 8px;
    border-radius: 10px;
    border: 1px solid var(--bordure);
    background: var(--carte);
    color: var(--texte-doux);
    font-size: .9rem;
    font-weight: 500;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .choix-theme button svg { width: 24px; height: 24px; }
  .choix-theme button:hover { border-color: var(--texte); color: var(--texte); }
  .choix-theme button[aria-pressed="true"] {
    border-color: var(--bordure-forte);
    box-shadow: 0 0 0 1px var(--bordure-forte);
    color: var(--texte);
  }

  /* ---------- Accès admin (dans le panneau réglages) ---------- */
  .separateur-panneau { height: 1px; background: var(--bordure); margin: 16px 0; }
  .form-code { display: flex; gap: 8px; }
  .champ-code {
    flex: 1;
    min-width: 0;
    background: var(--carte);
    border: 1px solid var(--bordure);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: .95rem;
    outline: none;
    transition: border-color .15s ease;
  }
  .champ-code:focus { border-color: var(--texte); }
  .form-code .bouton { padding: 10px 16px; font-size: .9rem; }
  .msg-code { margin-top: 8px; min-height: 1.2em; font-size: .85rem; color: var(--ko); }
  .msg-code.ok { color: var(--ok); }
  .actions-panneau { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }

  /* ---------- Boutons et états communs ---------- */
  .bouton.petit { padding: 9px 14px; font-size: .88rem; border-radius: 8px; }
  .bouton.danger,
  .bouton.clair.danger { background: var(--ko); border-color: var(--ko); color: var(--sur-couleur); }
  .bouton.danger:hover:not(:disabled),
  .bouton.clair.danger:hover:not(:disabled) { background: var(--ko); border-color: var(--ko); }
  .lien:disabled { opacity: .4; cursor: default; text-decoration: none; }
  .chapitre:has(input:disabled) { opacity: .5; cursor: not-allowed; }
  .chapitre:has(input:disabled):hover { border-color: var(--bordure); }
  .vide-admin { color: var(--texte-doux); font-size: .95rem; line-height: 1.5; padding: 6px 0; }

  /* ---------- Page admin ---------- */
  .bloc-admin {
    width: 100%;
    max-width: 820px;
    margin-top: clamp(76px, 9vh, 90px);
    padding-bottom: 70px;
  }
  .resume-admin { margin-top: 8px; font-size: .95rem; color: var(--texte-doux); }

  .onglets { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; }
  .onglet {
    background: var(--carte);
    border: 1px solid var(--bordure);
    border-radius: 999px;
    padding: 9px 18px;
    font-size: .95rem;
    font-weight: 500;
    color: var(--texte-doux);
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .onglet:hover { border-color: var(--texte); color: var(--texte); }
  .onglet[aria-pressed="true"] { background: var(--texte); border-color: var(--texte); color: var(--sur-texte); }

  .carte-admin {
    margin-top: 20px;
    background: var(--carte);
    border: 1px solid var(--bordure);
    border-radius: 14px;
    padding: 26px 28px;
  }
  .titre-bloc {
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--texte-doux);
  }
  .texte-admin { margin-top: 10px; line-height: 1.55; color: var(--texte-doux); }
  .carte-admin .ligne-actions { margin-top: 18px; }
  .carte-admin .saisie { padding: 11px 14px; font-size: 1rem; }
  .carte-admin textarea.saisie { min-height: 110px; }
  .carte-admin select.saisie { cursor: pointer; }

  .champ-admin { display: block; margin-top: 18px; }
  .champ-admin .libelle { display: block; margin-bottom: 7px; font-size: .88rem; font-weight: 600; }
  .champ-admin .aide { display: block; margin-top: 6px; font-size: .82rem; line-height: 1.45; color: var(--texte-doux); }

  .liste-fausses { display: flex; flex-direction: column; gap: 8px; }
  .ligne-fausse { display: flex; gap: 8px; }

/* =====================================================================
   DONNÉES MODIFIABLES : chapitres + définitions, enregistrés dans le navigateur
   ===================================================================== */
const CLE_DONNEES = 'histoire-donnees-v1';

const DEFAUT = {
  chapitres: [
    { id: 1, titre: "L'Europe, un théâtre majeur des guerres totales" },
    { id: 2, titre: "Démocraties fragilisées et expériences totalitaires dans l'Europe de l'entre-deux-guerres" }
  ],
  defs: DEFS_ORIGINE.map((d, i) => Object.assign({ id: i + 1 }, d))
};

function copie(x) { return JSON.parse(JSON.stringify(x)); }
function prochainId(liste) { return liste.reduce((m, x) => Math.max(m, x.id), 0) + 1; }

/* Vérifie et nettoie des données (stockage ou fichier importé) */
function nettoyer(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.chapitres) || !Array.isArray(d.defs)) return null;
  const txt = v => typeof v === 'string' ? v.trim().slice(0, 2000) : '';
  const chapitres = [];
  const idsChap = new Set();
  d.chapitres.forEach(c => {
    const titre = txt(c && c.titre);
    const id = Number(c && c.id);
    if (!titre || !Number.isInteger(id) || idsChap.has(id)) return;
    idsChap.add(id);
    chapitres.push({ id, titre });
  });
  const defs = [];
  const ids = new Set();
  d.defs.forEach(x => {
    if (!x || typeof x !== 'object') return;
    const terme = txt(x.terme), def = txt(x.def), chap = Number(x.chap);
    if (!terme || !def || !idsChap.has(chap)) return;
    let id = Number(x.id);
    if (!Number.isInteger(id) || ids.has(id)) { id = 1; while (ids.has(id)) id++; }
    ids.add(id);
    const vus = new Set([normaliser(def)]);
    const faux = [];
    (Array.isArray(x.faux) ? x.faux : []).map(txt).filter(Boolean).forEach(f => {
      const n = normaliser(f);
      if (!vus.has(n)) { vus.add(n); faux.push(f); }
    });
    const objet = {
      id, chap, terme, def, faux,
      accepte: (Array.isArray(x.accepte) ? x.accepte : []).map(txt).filter(Boolean)
    };
    const sous = txt(x.sous);
    if (sous) objet.sous = sous;
    defs.push(objet);
  });
  return { chapitres, defs };
}

function chargerDonnees() {
  try {
    const brut = localStorage.getItem(CLE_DONNEES);
    if (brut) {
      const d = nettoyer(JSON.parse(brut));
      if (d) return d;
    }
  } catch (e) {}
  return copie(DEFAUT);
}

function sauverDonnees() {
  try { localStorage.setItem(CLE_DONNEES, JSON.stringify(donnees)); return true; }
  catch (e) { return false; }
}

let donnees = chargerDonnees();

/* Réponses acceptées au niveau 2 : le terme, la précision et les variantes */
function reponsesAcceptees(q) {
  const liste = [q.terme, q.sous, ...(q.accepte || [])].filter(Boolean).map(normaliser).filter(Boolean);
  return [...new Set(liste)];
}

function numeroChap(id) { return donnees.chapitres.findIndex(c => c.id === id) + 1; }

function defsPourQuiz(niveau, chapitres) {

function melanger(tab) {
  const a = [...tab];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normaliser(s) {
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

function distance(a, b) {
  const m = a.length, n = b.length;
  const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      d[i][j] = Math.min(
        d[i - 1][j] + 1,
        d[i][j - 1] + 1,
        d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
  }
  return d[m][n];
}

/* Réponse acceptée, avec une petite tolérance pour les fautes de frappe */
function reponseJuste(saisie, question) {
  const s = normaliser(saisie);
  if (!s) return false;
  return reponsesAcceptees(question).some(att => {
    const tolerance = att.length >= 10 ? 2 : att.length >= 5 ? 1 : 0;
    return distance(s, att) <= tolerance;
  });
}

function el(tag, classe, texte) {
  const e = document.createElement(tag);
  if (classe) e.className = classe;
  if (texte !== undefined) e.textContent = texte;
  return e;
}

function nomTerme(q) {
  return q.sous ? q.terme + " (" + q.sous + ")" : q.terme;
}

  window.scrollTo(0, 0);
}

function niveauCourant() {
  const m = location.hash.match(/^#niveau-([123])$/);
  return m ? Number(m[1]) : null;
}

function afficher() {
  const niv = niveauCourant();
  if (location.hash === '#admin' && adminOuvert()) {
    rendreAdmin();
    montrer('admin');
    return;
  }
  if (niv) {
    const carte = document.querySelector('[data-niveau="' + niv + '"]');
    $('badge-niveau').textContent = 'Niveau ' + niv + ' · ' + carte.dataset.difficulte;
    $('consigne-niveau').textContent = carte.dataset.consigne;
    rendreChapitres(niv);
    montrer('chapitres');
  } else {
    montrer('niveaux');
  }
}

/* =====================================================================
   CHOIX DES CHAPITRES
   ===================================================================== */
let cases = [];

function majSelection() {
  const n = cases.filter(c => c.checked).length;
  $('compteur').textContent = n + (n > 1 ? ' chapitres sélectionnés' : ' chapitre sélectionné');
  $('commencer').disabled = n === 0;
  const actifs = cases.filter(c => !c.disabled);
  $('tout').textContent = actifs.length > 0 && n === actifs.length ? 'Tout désélectionner' : 'Tout sélectionner';
  $('tout').disabled = actifs.length === 0;
}

document.querySelectorAll('[data-niveau]').forEach(carte => {
  carte.addEventListener('click', () => {
    cases.forEach(c => c.checked = false);
    majSelection();
    location.hash = 'niveau-' + carte.dataset.niveau;
  });
});

$('retour').addEventListener('click', () => {
  history.length > 1 ? history.back() : (location.hash = '');
});

$('tout').addEventListener('click', () => {
  const actifs = cases.filter(c => !c.disabled);
  const toutCoche = actifs.every(c => c.checked);
  actifs.forEach(c => c.checked = !toutCoche);
  majSelection();
});

const SVG_COCHE = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function rendreChapitres(niveau) {
  const liste = $('liste-chapitres');
  liste.innerHTML = '';
  cases = [];
  if (!donnees.chapitres.length) {
    liste.append(el('p', 'vide-admin', 'Aucun chapitre pour le moment.'));
  }
  donnees.chapitres.forEach((c, i) => {
    const n = defsPourQuiz(niveau, [c.id]).length;
    const label = el('label', 'chapitre');
    const input = el('input');
    input.type = 'checkbox';
    input.name = 'chapitre';
    input.value = String(c.id);
    input.disabled = n === 0;
    input.addEventListener('change', majSelection);
    const caseEl = el('span', 'case');
    caseEl.innerHTML = SVG_COCHE;
    const texte = el('span', 'texte');
    const detail = n === 0 ? 'aucune définition' : n + (n > 1 ? ' définitions' : ' définition');
    texte.append(el('small', '', 'Chapitre ' + (i + 1) + ' · ' + detail), el('strong', '', c.titre));
    label.append(input, caseEl, texte);
    liste.append(label);
    cases.push(input);
  });
  majSelection();
}

window.addEventListener('hashchange', afficher);

/* =====================================================================
   QUIZ
   ===================================================================== */
let quiz = null;

function lancerQuiz() {
  const niveau = niveauCourant();
  if (!niveau) return;
  const chapitres = cases.filter(c => c.checked).map(c => Number(c.value));
  quiz = {
    niveau,
    chapitres,
    questions: melanger(defsPourQuiz(niveau, chapitres)),
    i: 0,
    score: 0,
    rates: []
  };
  if (!quiz.questions.length) return;
  $('badge-quiz').textContent = 'Niveau ' + niveau + ' · ' + NIVEAUX[niveau].nom;
  montrer('quiz');
  afficherQuestion();
}

$('commencer').addEventListener('click', lancerQuiz);
$('quitter').addEventListener('click', () => montrer('chapitres'));

function enteteQuestion(zone) {
  const total = quiz.questions.length;
  const prog = el('div', 'progression');
  const ligne = el('div', 'texte-prog');
  ligne.append(el('span', '', 'Question ' + (quiz.i + 1) + ' sur ' + total));
  ligne.append(el('span', '', 'Score : ' + quiz.score));
  const piste = el('div', 'piste');
  const barre = el('div');
  piste.append(barre);
  prog.append(ligne, piste);
  zone.append(prog);
  requestAnimationFrame(() => { barre.style.width = (quiz.i / total * 100) + '%'; });
}

function afficherQuestion() {
  const zone = $('zone-quiz');
  zone.innerHTML = '';
  if (quiz.i >= quiz.questions.length) return afficherResultat();

  const q = quiz.questions[quiz.i];
  enteteQuestion(zone);

  const carte = el('section', 'question');
  const etiquette = el('div', 'etiquette', 'Chapitre ' + numeroChap(q.chap) + ' · ' + NIVEAUX[quiz.niveau].etiquette);
  const enonce = el('div', 'enonce');
  const reponse = el('div', 'zone-reponse');
  const retour = el('div');

  if (quiz.niveau === 2) {
    enonce.classList.add('definition');
    enonce.textContent = q.def;
    etiquette.textContent = 'Chapitre ' + numeroChap(q.chap) + ' · ' + NIVEAUX[2].etiquette;
  } else {
    enonce.textContent = q.terme;
    if (q.sous) enonce.append(el('small', '', q.sous));
  }

  carte.append(etiquette, enonce, reponse, retour);
  zone.append(carte);

  if (quiz.niveau === 1) niveau1(q, reponse, retour);
  if (quiz.niveau === 2) niveau2(q, reponse, retour);
  if (quiz.niveau === 3) niveau3(q, reponse, retour);
}

function boutonSuivant() {
  const dernier = quiz.i === quiz.questions.length - 1;
  const b = el('button', 'bouton', dernier ? 'Voir mon résultat' : 'Question suivante →');
  b.type = 'button';
  b.addEventListener('click', () => { quiz.i++; afficherQuestion(); });
  return b;
}

function noterResultat(q, ok) {
  if (ok) quiz.score++; else quiz.rates.push(q);
}

/* ---------- Niveau 1 : choisir entre des propositions ---------- */
function niveau1(q, reponse, retour) {
  const options = el('div', 'options');
  const propositions = melanger([q.def, ...melanger(q.faux).slice(0, 3)]);
  const boutons = [];

  propositions.forEach((texte, k) => {
    const b = el('button', 'option');
    b.type = 'button';
    b.append(el('span', 'lettre', 'ABCD'[k]), el('span', '', texte));
    b.addEventListener('click', () => {
      const ok = texte === q.def;
      boutons.forEach((bt, idx) => {
        bt.disabled = true;
        if (propositions[idx] === q.def) bt.classList.add('juste');
        else if (bt === b) bt.classList.add('faux');
        else bt.classList.add('neutre');
      });
      noterResultat(q, ok);

      const corr = el('div', 'correction ' + (ok ? 'juste' : 'faux'));
      corr.append(el('div', 'statut', ok ? 'Bonne réponse !' : 'Pas tout à fait.'));
      retour.append(corr);
      const act = el('div', 'ligne-actions');
      act.append(boutonSuivant());
      retour.append(act);
      act.querySelector('button').focus();
    });
    boutons.push(b);
    options.append(b);
  });
  reponse.append(options);
}

/* ---------- Niveau 2 : trouver le nom ---------- */
function niveau2(q, reponse, retour) {
  const champ = el('input', 'saisie');
  champ.type = 'text';
  champ.placeholder = 'Écris le terme…';
  champ.autocomplete = 'off';
  champ.spellcheck = false;
  reponse.append(champ);

  const act = el('div', 'ligne-actions');
  const passer = el('button', 'bouton clair', 'Je ne sais pas');
  const valider = el('button', 'bouton', 'Valider');
  passer.type = valider.type = 'button';
  act.append(passer, valider);
  reponse.append(act);

  let fini = false;
  function corriger(abandon) {
    if (fini) return;
    const saisie = champ.value.trim();
    if (!abandon && !saisie) { champ.focus(); return; }
    fini = true;
    const ok = !abandon && reponseJuste(saisie, q);
    noterResultat(q, ok);
    champ.disabled = true;
    act.remove();

    const corr = el('div', 'correction ' + (ok ? 'juste' : 'faux'));
    corr.append(el('div', 'statut', ok ? 'Bonne réponse !' : (abandon ? 'La réponse était :' : 'Pas tout à fait. La réponse était :')));
    if (!ok || q.sous) {
      const t = el('div', 'bloc-def');
      t.append(el('span', '', 'Terme'), document.createTextNode(nomTerme(q)));
      corr.append(t);
    }
    retour.append(corr);
    const a2 = el('div', 'ligne-actions');
    a2.append(boutonSuivant());
    retour.append(a2);
    a2.querySelector('button').focus();
  }

  valider.addEventListener('click', () => corriger(false));
  passer.addEventListener('click', () => corriger(true));
  champ.addEventListener('keydown', e => { if (e.key === 'Enter') corriger(false); });
  champ.focus();
}

/* ---------- Niveau 3 : citer la définition ---------- */
function niveau3(q, reponse, retour) {
  const champ = el('textarea', 'saisie');
  champ.placeholder = 'Écris la définition en entier…';
  champ.spellcheck = false;
  reponse.append(champ);

  const act = el('div', 'ligne-actions');
  const valider = el('button', 'bouton', 'Voir la définition');
  valider.type = 'button';
  act.append(valider);
  reponse.append(act);

  valider.addEventListener('click', () => {
    champ.disabled = true;
    act.remove();

    const corr = el('div', 'correction');
    const maRep = el('div', 'bloc-def');
    maRep.append(el('span', '', 'Ta réponse'));
    maRep.append(el('div', 'ta-reponse', champ.value.trim() || '(vide)'));
    const attendu = el('div', 'bloc-def');
    attendu.append(el('span', '', 'Définition attendue'));
    attendu.append(el('div', '', q.def));
    corr.append(maRep, attendu);
    retour.append(corr);

    const question = el('div', 'etiquette', 'Compare, puis juge-toi honnêtement');
    question.style.marginTop = '20px';
    retour.append(question);

    const dernier = quiz.i === quiz.questions.length - 1;
    const a2 = el('div', 'ligne-actions');
    a2.style.justifyContent = 'flex-start';
    const non = el('button', 'bouton clair', 'À revoir');
    const oui = el('button', 'bouton', 'Je la connaissais');
    non.type = oui.type = 'button';
    non.addEventListener('click', () => { noterResultat(q, false); quiz.i++; afficherQuestion(); });
    oui.addEventListener('click', () => { noterResultat(q, true);  quiz.i++; afficherQuestion(); });
    a2.append(non, oui);
    retour.append(a2);
    if (dernier) question.textContent = 'Dernière question : compare, puis juge-toi honnêtement';
  });
  champ.focus();
}

/* ---------- Résultat ---------- */
function afficherResultat() {
  const zone = $('zone-quiz');
  zone.innerHTML = '';
  const total = quiz.questions.length;
  const pct = Math.round(quiz.score / total * 100);

  const bloc = el('section', 'resultat');
  const score = el('div', 'score');
  score.append(document.createTextNode(quiz.score));
  score.append(el('small', '', ' / ' + total));
  bloc.append(score);

  let msg;
  if (pct === 100) msg = "Sans faute, bravo !";
  else if (pct >= 75) msg = "Très bien, plus que quelques détails à revoir.";
  else if (pct >= 50) msg = "C'est un bon début, continue comme ça.";
  else msg = "Pas de panique, relis les définitions et réessaie.";
  bloc.append(el('p', 'message', msg));

  if (quiz.rates.length) {
    const rev = el('div', 'a-revoir');
    rev.append(el('h3', '', 'À revoir'));
    const ul = el('ul');
    quiz.rates.forEach(q => {
      const li = el('li');
      li.append(el('strong', '', nomTerme(q)), el('span', '', q.def));
      ul.append(li);
    });
    rev.append(ul);
    bloc.append(rev);
  }

  const act = el('div', 'actions');
  const rejouer = el('button', 'bouton', 'Recommencer');
  const chap = el('button', 'bouton clair', 'Changer de chapitres');
  const accueil = el('button', 'bouton clair', 'Changer de niveau');
  [rejouer, chap, accueil].forEach(b => b.type = 'button');
  rejouer.addEventListener('click', lancerQuiz);
  chap.addEventListener('click', () => montrer('chapitres'));
  accueil.addEventListener('click', () => { location.hash = ''; });
  act.append(rejouer, chap, accueil);
  bloc.append(act);

  zone.append(bloc);
}

/* =====================================================================
   ADMIN : accès par code + gestion des chapitres et des définitions
   ===================================================================== */
const SEL_CODE = 'histoire-admin:';
const EMPREINTE = '64615d591d984261617ebb91b87e40c2053e8632c9e393e4b68745300b24394e';
let adminMemoire = false;

/* SHA-256 (le code n'est jamais écrit en clair dans la page) */
function sha256(str) {
  const rrot = (v, a) => (v >>> a) | (v << (32 - a));
  const bytes = Array.from(new TextEncoder().encode(str));
  const bits = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  const hi = Math.floor(bits / 4294967296), lo = bits >>> 0;
  for (let i = 3; i >= 0; i--) bytes.push((hi >>> (i * 8)) & 255);
  for (let i = 3; i >= 0; i--) bytes.push((lo >>> (i * 8)) & 255);
  const K = [], H = [];
  let n = 0;
  for (let c = 2; n < 64; c++) {
    let premier = true;
    for (let d = 2; d * d <= c; d++) if (c % d === 0) { premier = false; break; }
    if (!premier) continue;
    if (n < 8) H[n] = (Math.pow(c, 1 / 2) % 1 * 4294967296) | 0;
    K[n++] = (Math.pow(c, 1 / 3) % 1 * 4294967296) | 0;
  }
  for (let off = 0; off < bytes.length; off += 64) {
    const w = new Array(64);
    for (let i = 0; i < 16; i++) {
      w[i] = (bytes[off + 4 * i] << 24) | (bytes[off + 4 * i + 1] << 16) | (bytes[off + 4 * i + 2] << 8) | bytes[off + 4 * i + 3];
    }
    for (let i = 16; i < 64; i++) {
      const s0 = rrot(w[i - 15], 7) ^ rrot(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rrot(w[i - 2], 17) ^ rrot(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rrot(e, 6) ^ rrot(e, 11) ^ rrot(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rrot(a, 2) ^ rrot(a, 13) ^ rrot(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

function codeValide(code) { return sha256(SEL_CODE + code.trim()) === EMPREINTE; }

function adminOuvert() {
  if (adminMemoire) return true;
  try { return sessionStorage.getItem('histoire-admin') === '1'; } catch (e) { return false; }
}

function definirAdmin(v) {
  adminMemoire = v;
  try {
    if (v) sessionStorage.setItem('histoire-admin', '1');
    else sessionStorage.removeItem('histoire-admin');
  } catch (e) {}
}

/* ---------- Outils d'interface ---------- */
const admin = { onglet: 'defs', edition: null, filtre: 'tous', message: null, dernierChap: null };

function champ(libelle, controle, aide) {
  const w = el('label', 'champ-admin');
  w.append(el('span', 'libelle', libelle), controle);
  if (aide) w.append(el('small', 'aide', aide));
  return w;
}

function saisieTexte(valeur, placeholder) {
  const i = el('input', 'saisie');
  i.type = 'text';
  i.value = valeur || '';
  i.placeholder = placeholder || '';
  i.autocomplete = 'off';
  i.spellcheck = false;
  return i;
}

/* Bouton qui demande un second clic pour confirmer (pas de fenêtre popup) */
function boutonConfirmer(texte, classe, action) {
  const b = el('button', classe, texte);
  b.type = 'button';
  let arme = false, minuteur;
  b.addEventListener('click', () => {
    if (!arme) {
      arme = true;
      b.textContent = 'Confirmer ?';
      b.classList.add('danger');
      minuteur = setTimeout(() => { arme = false; b.textContent = texte; b.classList.remove('danger'); }, 3500);
      return;
    }
    clearTimeout(minuteur);
    action();
  });
  return b;
}

function enregistrer(texte) {
  const ok = sauverDonnees();
  admin.message = ok
    ? { texte, ok: true }
    : { texte: "Impossible d'enregistrer dans ce navigateur (stockage bloqué) : les changements seront perdus à la fermeture.", ok: false };
  rendreAdmin();
}

/* ---------- Rendu général ---------- */
function rendreAdmin() {
  const nbChap = donnees.chapitres.length, nbDefs = donnees.defs.length;
  $('resume-admin').textContent =
    nbChap + (nbChap > 1 ? ' chapitres' : ' chapitre') + ' · ' + nbDefs + (nbDefs > 1 ? ' définitions' : ' définition');

  const onglets = $('onglets-admin');
  onglets.innerHTML = '';
  [['defs', 'Définitions'], ['chaps', 'Chapitres'], ['save', 'Sauvegarde']].forEach(([id, nom]) => {
    const b = el('button', 'onglet', nom);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(admin.onglet === id));
    b.addEventListener('click', () => { admin.onglet = id; admin.edition = null; admin.message = null; rendreAdmin(); });
    onglets.append(b);
  });

  const zone = $('contenu-admin');
  zone.innerHTML = '';
  if (admin.message) {
    zone.append(el('div', 'msg-admin ' + (admin.message.ok ? 'ok' : 'ko'), admin.message.texte));
    admin.message = null;
  }
  if (admin.onglet === 'defs') rendreDefs(zone);
  else if (admin.onglet === 'chaps') rendreChaps(zone);
  else rendreSauvegarde(zone);
}

/* ---------- Onglet Chapitres ---------- */
function rendreChaps(zone) {
  const form = el('form', 'carte-admin');
  form.append(el('div', 'titre-bloc', 'Nouveau chapitre'));
  const titre = saisieTexte('', 'Ex. : La Seconde Guerre mondiale');
  const msg = el('div', 'msg-form');
  const ajout = el('button', 'bouton', 'Ajouter le chapitre');
  ajout.type = 'submit';
  const act = el('div', 'ligne-actions');
  act.append(ajout);
  form.append(champ('Titre du chapitre', titre), msg, act);
  form.addEventListener('submit', e => {
    e.preventDefault();
    const t = titre.value.trim();
    if (!t) { msg.textContent = 'Donne un titre au chapitre.'; titre.focus(); return; }
    if (donnees.chapitres.some(c => normaliser(c.titre) === normaliser(t))) {
      msg.textContent = 'Un chapitre porte déjà ce titre.';
      return;
    }
    donnees.chapitres.push({ id: prochainId(donnees.chapitres), titre: t });
    enregistrer('Chapitre ajouté.');
  });
  zone.append(form);

  const bloc = el('div', 'carte-admin');
  bloc.append(el('div', 'titre-bloc', 'Chapitres existants'));
  if (!donnees.chapitres.length) bloc.append(el('p', 'vide-admin', 'Aucun chapitre pour le moment.'));

  donnees.chapitres.forEach((c, i) => {
    const nb = donnees.defs.filter(d => d.chap === c.id).length;
    const ligne = el('div', 'ligne-chap');

    const tete = el('div', 'tete-chap');
    tete.append(el('span', 'num-chap', 'Chapitre ' + (i + 1)),
                el('span', 'nb-chap', nb + (nb > 1 ? ' définitions' : ' définition')));

    const input = saisieTexte(c.titre);
    input.setAttribute('aria-label', 'Titre du chapitre ' + (i + 1));
    const etat = el('span', 'etat-chap');
    input.addEventListener('change', () => {
      const t = input.value.trim();
      if (!t) { input.value = c.titre; return; }
      c.titre = t;
      input.value = t;
      etat.textContent = sauverDonnees() ? 'Enregistré' : 'Non enregistré';
      setTimeout(() => { etat.textContent = ''; }, 1800);
    });
    const champLigne = el('div', 'champ-ligne');
    champLigne.append(input, etat);

    const actions = el('div', 'actions-chap');
    const haut = el('button', 'bouton clair petit', '↑');
    const bas = el('button', 'bouton clair petit', '↓');
    haut.type = bas.type = 'button';
    haut.setAttribute('aria-label', 'Monter le chapitre');
    bas.setAttribute('aria-label', 'Descendre le chapitre');
    haut.disabled = i === 0;
    bas.disabled = i === donnees.chapitres.length - 1;
    haut.addEventListener('click', () => {
      [donnees.chapitres[i - 1], donnees.chapitres[i]] = [donnees.chapitres[i], donnees.chapitres[i - 1]];
      enregistrer("Ordre des chapitres modifié.");
    });
    bas.addEventListener('click', () => {
      [donnees.chapitres[i + 1], donnees.chapitres[i]] = [donnees.chapitres[i], donnees.chapitres[i + 1]];
      enregistrer("Ordre des chapitres modifié.");
    });
    const suppr = boutonConfirmer('Supprimer', 'bouton clair petit', () => {
      donnees.defs = donnees.defs.filter(d => d.chap !== c.id);
      donnees.chapitres = donnees.chapitres.filter(x => x.id !== c.id);
      if (admin.filtre === String(c.id)) admin.filtre = 'tous';
      enregistrer('Chapitre supprimé' + (nb ? ' avec ses ' + nb + ' définition' + (nb > 1 ? 's' : '') : '') + '.');
    });
    actions.append(haut, bas, suppr);

    ligne.append(tete, champLigne, actions);
    bloc.append(ligne);
  });
  zone.append(bloc);
}

/* ---------- Onglet Définitions ---------- */
function rendreDefs(zone) {
  const editee = admin.edition ? donnees.defs.find(d => d.id === admin.edition) : null;
  if (admin.edition && !editee) admin.edition = null;

  const form = el('form', 'carte-admin');
  form.id = 'form-def';
  form.append(el('div', 'titre-bloc', editee ? 'Modifier la définition' : 'Nouvelle définition'));

  if (!donnees.chapitres.length) {
    form.append(el('p', 'vide-admin', "Crée d'abord un chapitre (onglet Chapitres) pour pouvoir y ajouter des définitions."));
    zone.append(form);
    return;
  }

  const selChap = el('select', 'saisie');
  donnees.chapitres.forEach((c, i) => {
    const o = el('option', '', 'Chapitre ' + (i + 1) + ' · ' + c.titre);
    o.value = String(c.id);
    selChap.append(o);
  });
  const chapInitial = editee ? editee.chap
    : (admin.dernierChap && donnees.chapitres.some(c => c.id === admin.dernierChap) ? admin.dernierChap : donnees.chapitres[0].id);
  selChap.value = String(chapInitial);

  const terme = saisieTexte(editee ? editee.terme : '', 'Ex. : Armistice');
  const sous = saisieTexte(editee && editee.sous ? editee.sous : '', 'Ex. : Union des républiques socialistes soviétiques');
  const def = el('textarea', 'saisie');
  def.value = editee ? editee.def : '';
  def.placeholder = 'Écris la définition exactement comme tu dois la connaître…';
  def.spellcheck = false;

  /* Fausses propositions : liste dynamique, de 2 à 6 */
  const fausses = editee ? editee.faux.slice() : ['', '', ''];
  while (fausses.length < 2) fausses.push('');
  const listeFausses = el('div', 'liste-fausses');
  const plus = el('button', 'bouton clair petit', '+ Ajouter une proposition');
  plus.type = 'button';
  function dessinerFausses() {
    listeFausses.innerHTML = '';
    fausses.forEach((val, k) => {
      const ligne = el('div', 'ligne-fausse');
      const inp = saisieTexte(val, 'Fausse proposition ' + (k + 1));
      inp.setAttribute('aria-label', 'Fausse proposition ' + (k + 1));
      inp.addEventListener('input', () => { fausses[k] = inp.value; });
      ligne.append(inp);
      if (fausses.length > 2) {
        const x = el('button', 'bouton clair petit', '✕');
        x.type = 'button';
        x.setAttribute('aria-label', 'Retirer cette proposition');
        x.addEventListener('click', () => { fausses.splice(k, 1); dessinerFausses(); });
        ligne.append(x);
      }
      listeFausses.append(ligne);
    });
    plus.hidden = fausses.length >= 6;
  }
  plus.addEventListener('click', () => {
    fausses.push('');
    dessinerFausses();
    listeFausses.lastChild.querySelector('input').focus();
  });
  dessinerFausses();

  const blocFausses = el('div', 'champ-admin');
  blocFausses.append(
    el('span', 'libelle', 'Fausses propositions (niveau 1)'),
    listeFausses,
    plus,
    el('small', 'aide', 'Au moins 2. Si tu en mets plus de 3, 3 sont tirées au hasard à chaque question.')
  );

  const variantesInit = editee
    ? (editee.accepte || []).filter(a => {
        const n = normaliser(a);
        return n && n !== normaliser(editee.terme) && n !== normaliser(editee.sous || '');
      })
    : [];
  const variantes = saisieTexte(variantesInit.join(', '), 'Ex. : guerre de mouvement, mouvements');

  const msg = el('div', 'msg-form');
  const act = el('div', 'ligne-actions');
  if (editee) {
    const ann = el('button', 'bouton clair', 'Annuler');
    ann.type = 'button';
    ann.addEventListener('click', () => { admin.edition = null; rendreAdmin(); });
    act.append(ann);
  }
  const valider = el('button', 'bouton', editee ? 'Enregistrer les modifications' : 'Ajouter la définition');
  valider.type = 'submit';
  act.append(valider);

  form.append(
    champ('Chapitre', selChap),
    champ('Terme', terme, 'Le mot ou l’expression à définir.'),
    champ('Nom complet ou précision (facultatif)', sous, 'Affiché sous le terme, par exemple le nom développé d’un sigle.'),
    champ('Définition', def),
    blocFausses,
    champ('Autres réponses acceptées au niveau 2 (facultatif)', variantes,
      'Séparées par des virgules. Le terme et la précision sont déjà acceptés ; les accents et les majuscules sont ignorés.'),
    msg,
    act
  );

  form.addEventListener('submit', e => {
    e.preventDefault();
    const chapId = Number(selChap.value);
    const t = terme.value.trim(), s = sous.value.trim(), d = def.value.trim();
    if (!t) { msg.textContent = 'Le terme est obligatoire.'; terme.focus(); return; }
    if (!d) { msg.textContent = 'La définition est obligatoire.'; def.focus(); return; }
    const vus = new Set([normaliser(d)]);
    const faux = [];
    fausses.map(f => f.trim()).filter(Boolean).forEach(f => {
      const n = normaliser(f);
      if (!vus.has(n)) { vus.add(n); faux.push(f); }
    });
    if (faux.length < 2) {
      msg.textContent = 'Ajoute au moins 2 fausses propositions, différentes entre elles et de la définition.';
      return;
    }
    const idEdite = editee ? editee.id : null;
    if (donnees.defs.some(x => x.id !== idEdite && x.chap === chapId && normaliser(x.terme) === normaliser(t))) {
      msg.textContent = 'Ce terme existe déjà dans ce chapitre.';
      terme.focus();
      return;
    }
    const accepte = variantes.value.split(',').map(v => v.trim()).filter(Boolean);
    const objet = { chap: chapId, terme: t, def: d, faux, accepte };
    if (s) objet.sous = s;
    if (editee) {
      const garde = editee.id;
      Object.keys(editee).forEach(k => delete editee[k]);
      Object.assign(editee, objet, { id: garde });
    } else {
      donnees.defs.push(Object.assign({ id: prochainId(donnees.defs) }, objet));
    }
    admin.dernierChap = chapId;
    admin.edition = null;
    enregistrer(editee ? 'Définition modifiée.' : 'Définition ajoutée.');
  });
  zone.append(form);

  /* Liste des définitions existantes */
  const liste = el('div', 'carte-admin');
  const entete = el('div', 'entete-liste');
  entete.append(el('div', 'titre-bloc', 'Définitions existantes'));
  const filtre = el('select', 'saisie filtre');
  filtre.setAttribute('aria-label', 'Filtrer par chapitre');
  const oTous = el('option', '', 'Tous les chapitres');
  oTous.value = 'tous';
  filtre.append(oTous);
  donnees.chapitres.forEach((c, i) => {
    const o = el('option', '', 'Chapitre ' + (i + 1));
    o.value = String(c.id);
    filtre.append(o);
  });
  filtre.value = admin.filtre;
  if (filtre.value !== admin.filtre) { admin.filtre = 'tous'; filtre.value = 'tous'; }
  entete.append(filtre);
  liste.append(entete);

  const corps = el('div');
  function dessinerListe() {
    corps.innerHTML = '';
    donnees.chapitres.forEach((c, i) => {
      if (admin.filtre !== 'tous' && String(c.id) !== admin.filtre) return;
      const defs = donnees.defs.filter(d => d.chap === c.id);
      const groupe = el('div', 'groupe-chap');
      groupe.append(el('h3', '', 'Chapitre ' + (i + 1) + ' · ' + c.titre));
      if (!defs.length) groupe.append(el('p', 'vide-admin', 'Aucune définition dans ce chapitre.'));
      defs.forEach(d => {
        const l = el('div', 'ligne-def' + (admin.edition === d.id ? ' en-edition' : ''));
        const txt = el('div', 'txt-def');
        const nom = el('strong', '', d.terme);
        if (d.sous) nom.append(el('small', '', d.sous));
        txt.append(
          nom,
          el('p', 'extrait', d.def),
          el('span', 'meta', d.faux.length + (d.faux.length > 1 ? ' fausses propositions' : ' fausse proposition'))
        );
        const actions = el('div', 'actions-def');
        const mod = el('button', 'bouton clair petit', 'Modifier');
        mod.type = 'button';
        mod.addEventListener('click', () => {
          admin.edition = d.id;
          admin.message = null;
          rendreAdmin();
          const f = $('form-def');
          if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        const sup = boutonConfirmer('Supprimer', 'bouton clair petit', () => {
          donnees.defs = donnees.defs.filter(x => x.id !== d.id);
          if (admin.edition === d.id) admin.edition = null;
          enregistrer('Définition supprimée.');
        });
        actions.append(mod, sup);
        l.append(txt, actions);
        groupe.append(l);
      });
      corps.append(groupe);
    });
  }
  filtre.addEventListener('change', () => { admin.filtre = filtre.value; dessinerListe(); });
  dessinerListe();
  liste.append(corps);
  zone.append(liste);
}

/* ---------- Onglet Sauvegarde ---------- */
function rendreSauvegarde(zone) {
  const info = el('div', 'carte-admin');
  info.append(
    el('div', 'titre-bloc', 'Où sont enregistrées tes données ?'),
    el('p', 'texte-admin',
      "Tout ce que tu modifies ici est enregistré dans ce navigateur, sur cet appareil. Un autre appareil ou un autre navigateur affichera le contenu d'origine. Exporte un fichier pour garder une copie ou pour retrouver tes données ailleurs.")
  );
  zone.append(info);

  const exp = el('div', 'carte-admin');
  exp.append(
    el('div', 'titre-bloc', 'Exporter'),
    el('p', 'texte-admin', 'Télécharge un fichier avec tous tes chapitres et toutes tes définitions.')
  );
  const bExp = el('button', 'bouton', 'Exporter mes données');
  bExp.type = 'button';
  bExp.addEventListener('click', () => {
    const contenu = JSON.stringify({ version: 1, chapitres: donnees.chapitres, defs: donnees.defs }, null, 2);
    const url = URL.createObjectURL(new Blob([contenu], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'definitions-histoire.json';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  const actExp = el('div', 'ligne-actions');
  actExp.style.justifyContent = 'flex-start';
  actExp.append(bExp);
  exp.append(actExp);
  zone.append(exp);

  const imp = el('div', 'carte-admin');
  imp.append(
    el('div', 'titre-bloc', 'Importer'),
    el('p', 'texte-admin', 'Charge un fichier exporté plus tôt. Il remplace tout ce qui est enregistré ici.')
  );
  const fichier = el('input');
  fichier.type = 'file';
  fichier.accept = 'application/json,.json';
  fichier.hidden = true;
  fichier.id = 'fichier-import';
  const bImp = el('button', 'bouton clair', 'Choisir un fichier…');
  bImp.type = 'button';
  bImp.addEventListener('click', () => fichier.click());
  const msgImp = el('div', 'msg-form');
  const actImp = el('div', 'ligne-actions');
  actImp.style.justifyContent = 'flex-start';
  const zoneConf = el('div', 'ligne-actions');
  zoneConf.style.justifyContent = 'flex-start';
  fichier.addEventListener('change', () => {
    const f = fichier.files[0];
    if (!f) return;
    const lecteur = new FileReader();
    lecteur.onload = () => {
      let d = null;
      try { d = nettoyer(JSON.parse(lecteur.result)); } catch (e) {}
      zoneConf.innerHTML = '';
      if (!d) { msgImp.textContent = "Ce fichier n'est pas valide."; return; }
      msgImp.textContent = '';
      zoneConf.append(boutonConfirmer(
        'Remplacer mes données (' + d.chapitres.length + ' chapitre' + (d.chapitres.length > 1 ? 's' : '') +
        ', ' + d.defs.length + ' définition' + (d.defs.length > 1 ? 's' : '') + ')',
        'bouton',
        () => { donnees = d; admin.filtre = 'tous'; admin.edition = null; enregistrer('Données importées.'); }
      ));
    };
    lecteur.readAsText(f);
    fichier.value = '';
  });
  actImp.append(bImp);
  imp.append(fichier, actImp, msgImp, zoneConf);
  zone.append(imp);

  const rst = el('div', 'carte-admin');
  rst.append(
    el('div', 'titre-bloc', 'Réinitialiser'),
    el('p', 'texte-admin', "Supprime tes ajouts et tes modifications, et revient aux chapitres et aux définitions d'origine.")
  );
  const actRst = el('div', 'ligne-actions');
  actRst.style.justifyContent = 'flex-start';
  actRst.append(boutonConfirmer("Revenir aux données d'origine", 'bouton clair', () => {
    donnees = copie(DEFAUT);
    admin.filtre = 'tous';
    admin.edition = null;
    enregistrer("Données d'origine rétablies.");
  }));
  rst.append(actRst);
  zone.append(rst);
}

$('quitter-admin').addEventListener('click', () => { location.hash = ''; });

/* =====================================================================
   RÉGLAGES : jour / nuit
   ===================================================================== */
const boutonReglages = $('bouton-reglages');
const panneau = $('panneau-reglages');
const choixTheme = [...document.querySelectorAll('[data-theme-choix]')];

function appliquerTheme(t, sauver) {
  document.documentElement.setAttribute('data-theme', t);
  choixTheme.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeChoix === t)));
  if (sauver) { try { localStorage.setItem('theme', t); } catch (e) {} }
}

function ouvrirPanneau(ouvert) {
  panneau.hidden = !ouvert;
  boutonReglages.setAttribute('aria-expanded', String(ouvert));
}

choixTheme.forEach(b => b.addEventListener('click', () => appliquerTheme(b.dataset.themeChoix, true)));
boutonReglages.addEventListener('click', e => { e.stopPropagation(); ouvrirPanneau(panneau.hidden); });
panneau.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => ouvrirPanneau(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') ouvrirPanneau(false); });

const formCode = $('form-code');
const champCode = $('champ-code');
const msgCode = $('msg-code');
const blocAdmin = $('bloc-admin-ouvert');

function majAccesAdmin() {
  const ok = adminOuvert();
  formCode.hidden = ok;
  blocAdmin.hidden = !ok;
  msgCode.textContent = ok ? 'Accès admin déverrouillé.' : '';
  msgCode.className = 'msg-code' + (ok ? ' ok' : '');
}

formCode.addEventListener('submit', e => {
  e.preventDefault();
  if (codeValide(champCode.value)) {
    definirAdmin(true);
    champCode.value = '';
    majAccesAdmin();
  } else {
    msgCode.textContent = 'Code incorrect.';
    msgCode.className = 'msg-code';
    champCode.select();
  }
});

$('ouvrir-admin').addEventListener('click', () => {
  ouvrirPanneau(false);
  if (location.hash === '#admin') afficher(); else location.hash = 'admin';
});

$('verrouiller').addEventListener('click', () => {
  definirAdmin(false);
  majAccesAdmin();
  if (location.hash === '#admin') location.hash = '';
});

majAccesAdmin();

appliquerTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false);

majSelection();
afficher();
</script>
